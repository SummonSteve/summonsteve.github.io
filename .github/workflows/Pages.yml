name: Pages

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: 'Build and Deploy'
        uses: shalzz/zola-deploy-action@v0.15.3
        run: git config --global --add safe.directory /github/workspace
        env:
          PAGES_BRANCH: gh-pages
          TOKEN: ${{ secrets.TOKEN }}
